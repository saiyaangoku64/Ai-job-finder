<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentGig.AI - Smart Job Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
              pixel: ['Pixelify Sans', 'sans-serif'],
            },
            colors: {
              background: '#050505',
              surface: '#0a0a0a',
            },
            animation: {
              'blob': 'blob 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1)',
              'fade-up': 'fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'shine': 'shine 2s infinite',
              'breathing-gradient': 'breathingGradient 20s ease-in-out infinite',
              'flow': 'flow 2s linear infinite',
              'spin-slow': 'spin 8s linear infinite',
              'beam': 'beam 2s infinite linear',
              'beam-travel': 'beamTravel 15s infinite linear',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '25%': { transform: 'translate(30px, -50px) scale(1.4)' }, 
                '50%': { transform: 'translate(-30px, 20px) scale(0.9)' }, 
                '75%': { transform: 'translate(20px, 40px) scale(1.3)' },
                '100%': { transform: 'translate(-10px, -10px) scale(1)' },
              },
              breathingGradient: {
                '0%': { transform: 'scale(1) translate(0, 0)' },
                '50%': { transform: 'scale(1.2) translate(-2%, -2%)' },
                '100%': { transform: 'scale(1) translate(0, 0)' },
              },
              fadeUp: {
                '0%': { opacity: 0, transform: 'translateY(20px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
              shine: {
                '100%': { transform: 'translateX(100%)' },
              },
              flow: {
                '0%': { strokeDashoffset: '24' },
                '100%': { strokeDashoffset: '0' },
              },
              beam: {
                '0%': { top: '-100%', opacity: 0 },
                '10%': { opacity: 1 },
                '90%': { opacity: 1 },
                '100%': { top: '100%', opacity: 0 },
              },
              beamTravel: {
                '0%': { strokeDashoffset: '4600' },
                '100%': { strokeDashoffset: '0' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body { 
        background-color: #050505; 
        color: #ffffff; 
        overflow-x: hidden; 
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Light Mode Overrides */
      html:not(.dark) body {
        background-color: #ffffff;
        color: #000000;
      }

      /* Noise Texture - ULTRA VISIBLE */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 9999; /* On top of everything */
        opacity: 0.12; /* Increased opacity for visibility */
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Dark mode noise blend */
      html.dark .bg-noise {
        opacity: 0.1;
        mix-blend-mode: overlay;
      }
      
      /* Light mode noise blend */
      html:not(.dark) .bg-noise {
        opacity: 0.08;
        mix-blend-mode: multiply;
      }

      /* Smooth Scrolling */
      html { scroll-behavior: smooth; }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
      html:not(.dark) ::-webkit-scrollbar-thumb { background: #ccc; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.39.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root" class="relative z-10"></div>
    <div class="bg-noise"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
